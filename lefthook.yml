glob_matcher: doublestar
pre-commit:
  commands:
    swift-style:
      glob: "**/*.swift"
      run: swift format lint --strict -- {staged_files}

# Exact commit metadata checks, alongside existing checks.
commit-msg:
  commands:
    credit-message:
      run: python3 "$(git rev-parse --git-path credit-guard/entry.py)" commit-msg {1}
pre-push:
  commands:
    credit-objects:
      use_stdin: true
      run: python3 "$(git rev-parse --git-path credit-guard/entry.py)" pre-push
